project_id = "studio-ritua"

[auth]
site_url = "https://studioritua.com.br"
additional_redirect_urls = ["https://studioritua.com.br", "https://studioritua.com.br/?admin=1", "https://espi0-bat.github.io/studio-ritua/", "https://espi0-bat.github.io/studio-ritua/?admin=1", "http://localhost:5173/", "http://localhost:5173/?admin=1", "http://127.0.0.1:5173/", "http://127.0.0.1:5173/?admin=1"]
enable_signup = false

[auth.email]
# "enabled" é ignorado pelo CLI. Quem liga o provedor de e-mail no push é o
# "enable_signup" desta seção; o cadastro público continua fechado pelo
# "enable_signup = false" da seção [auth] acima.
enabled = true
enable_signup = true
enable_confirmations = true
otp_length = 8
otp_expiry = 600
max_frequency = "1m"


[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
time_to_live = 86400
