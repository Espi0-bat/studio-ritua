project_id = "studio-ritua"

[auth]
site_url = "https://studioritua.com.br"
additional_redirect_urls = ["https://studioritua.com.br", "https://studioritua.com.br/?admin=1", "http://localhost:5173/", "http://localhost:5173/?admin=1", "http://127.0.0.1:5173/", "http://127.0.0.1:5173/?admin=1"]
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
# "enabled" é ignorado pelo CLI. Quem liga o provedor de e-mail no push é o
# "enable_signup" desta seção; o cadastro público continua fechado pelo
# "enable_signup = false" da seção [auth] acima.
enabled = true
enable_signup = true
enable_confirmations = true
otp_length = 8
otp_expiry = 600
max_frequency = "1m"

# Todas as chaves ficam explícitas: o push envia o valor zero das que faltam.
# email_sent e anonymous_users contam por hora; as demais, por 5 minutos, por IP.
[auth.rate_limit]
email_sent = 4
sms_sent = 30
anonymous_users = 10
token_refresh = 150
sign_in_sign_ups = 10
token_verifications = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
time_to_live = 86400
